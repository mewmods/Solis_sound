<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Página hospedada em https: é o Referer dela que o YouTube exige.
         O CEF do FiveM não manda Referer do cfx-nui, daí o erro 153. -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Solis Player</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #host, #host iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
</head>
<body>
    <div id="host"></div>

    <script>
    /* player.html — ponte do YouTube para o solis_sound.
       Roda em um domínio https (worker, Pages, Netlify, GitHub Pages...), por isso
       a embed chega ao YouTube com um Referer válido e o erro 153 não aparece.

       Recebe do motor:  { t:'yt', id, op:'play'|'pause'|'seek'|'vol', time, value }
       Envia ao motor:   { t:'yt', id, ev:'ready'|'state'|'error', state, duration, code } */
    (function () {
        'use strict';

        var params  = new URLSearchParams(location.search);
        var videoId = params.get('id') || params.get('v') || '';
        var soundId = params.get('s') || '';
        var startAt = parseInt(params.get('t') || '0', 10) || 0;
        var startVol = params.get('vol');

        var player = null;
        var ready = false;
        var queue = [];          // comandos que chegaram antes do player existir
        var started = false;

        function send(payload) {
            payload.t = 'yt';
            payload.id = soundId;
            try { parent.postMessage(payload, '*'); } catch (e) { }
        }

        // aceita o formato do motor (op) e o da página do worker (action)
        var A = { play: 'play', resume: 'play', pause: 'pause', seek: 'seek', vol: 'vol', volume: 'vol' };

        function apply(cmd) {
            if (!player) return;

            switch (A[cmd.op || cmd.action]) {
                case 'play':
                    if (player.playVideo) player.playVideo();
                    break;
                case 'pause':
                    if (player.pauseVideo) player.pauseVideo();
                    break;
                case 'seek':
                    if (player.seekTo && typeof cmd.time === 'number') player.seekTo(cmd.time, true);
                    break;
                case 'vol':
                    var value = typeof cmd.value === 'number' ? cmd.value : cmd.vol;
                    if (player.setVolume && typeof value === 'number') {
                        player.setVolume(Math.max(0, Math.min(100, Math.round(value))));
                        if (value > 0 && player.unMute) player.unMute();
                        else if (player.mute) player.mute();
                    }
                    break;
            }
        }

        function run(cmd) {
            if (!cmd || !(cmd.op || cmd.action)) return;
            if (ready) apply(cmd); else queue.push(cmd);
        }

        window.addEventListener('message', function (event) {
            var data = event.data;
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch (e) { return; }
            }
            if (!data || !(data.op || data.action)) return;
            if (data.id && soundId && data.id !== soundId) return;
            run(data);
        });

        window.onYouTubeIframeAPIReady = function () { createPlayer(); };

        var attempts = 0;

        function createPlayer() {
            attempts++;
            ready = false;

            var host = document.getElementById('host');
            if (!host) return;

            if (player && player.destroy) { try { player.destroy(); } catch (e) { } }
            host.innerHTML = '<div></div>';

            player = new YT.Player(host.firstChild, {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    playsinline: 1,
                    rel: 0,
                    iv_load_policy: 3,
                    modestbranding: 1,
                    mute: 1
                },
                events: {
                    onReady: function () {
                        ready = true;

                        if (startAt > 0) apply({ op: 'seek', time: startAt });
                        if (startVol !== null) apply({ op: 'vol', value: parseInt(startVol, 10) });

                        send({ ev: 'ready', duration: player.getDuration(), currentTime: player.getCurrentTime() });
                        for (var i = 0; i < queue.length; i++) apply(queue[i]);
                        queue.length = 0;
                    },

                    onStateChange: function (event) {
                        if (event.data === 1 && !started) started = true;
                        send({
                            ev: 'state',
                            state: event.data,
                            duration: player.getDuration(),
                            currentTime: player.getCurrentTime()
                        });
                    },

                    onError: function (event) {
                        // 153 é intermitente na primeira criação (o CEF não manda
                        // Referer); recriar o player resolve na segunda tentativa.
                        if (event.data === 153 && attempts < 3) {
                            setTimeout(createPlayer, 900);
                            return;
                        }

                        send({ ev: 'error', code: event.data });
                    }
                }
            });
        }

        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
    })();
    </script>
</body>
</html>
